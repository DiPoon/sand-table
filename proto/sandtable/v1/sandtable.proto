// Wire protocol of sandtable. One WebSocket binary frame carries exactly one
// ClientMessage or ServerMessage. Semantics are described in docs/protocol.md.
syntax = "proto3";

package sandtable.v1;

option go_package = "sandtable/server/internal/pb/sandtable/v1;sandtablev1";

// ---- Client to server ----

message ClientMessage {
  oneof msg {
    Hello hello = 1;
    Command command = 2;
    StartMatch start_match = 3;
    SetPause set_pause = 4;
    SetSpeed set_speed = 5;
  }
}

message Hello {
  uint32 protocol_version = 1;
  string match_id = 2;
  string faction = 3; // faction key
  string player_name = 4;
  string session_token = 5; // optional: replaces a live connection of the same player
}

message Command {
  uint32 client_seq = 1;
  oneof cmd {
    MoveDivision move_division = 10;
  }
}

message MoveDivision {
  uint32 division_id = 1;
  uint32 destination = 2; // province ID
}

message StartMatch {}

message SetPause {
  bool paused = 1;
}

message SetSpeed {
  uint32 speed = 1;
}

// ---- Server to client ----

message ServerMessage {
  oneof msg {
    Welcome welcome = 1;
    Snapshot snapshot = 2;
    Delta delta = 3;
    CommandResult command_result = 4;
    MatchStatus match_status = 5;
    Error error = 6;
  }
}

message Welcome {
  uint32 faction_id = 1;
  string session_token = 2;
  StaticData static = 3;
  MatchStatus status = 4;
}

message StaticData {
  bytes data_hash = 1;
  repeated Terrain terrains = 2;     // index = terrain ID
  repeated UnitType unit_types = 3;  // index = unit type ID
  repeated Province provinces = 4;   // index = province ID
  repeated Edge edges = 5;
  repeated Faction factions = 6;     // faction ID = index + 1
  repeated State states = 7;         // state ID = index + 1; 0 = none
}

message Terrain {
  string key = 1;
  string name = 2;
  int64 move_cost = 3;
  int64 defense_bonus = 4;
  int64 combat_width = 5;
  bool passable = 6;
}

message UnitType {
  string key = 1;
  string name = 2;
  int32 max_strength = 3;
  int32 max_org = 4;
  int64 attack = 5;
  int64 defense = 6;
  int64 speed = 7;
  int64 org_recovery = 8;
  int64 width = 9;
  int64 reinforce_chance = 10;
}

message Province {
  string key = 1;
  string name = 2;
  uint32 terrain = 3;
  int32 x = 4;
  int32 y = 5;
  bool hub = 6; // supply hub
  uint32 state = 7; // state ID, 0 = none
  int32 vp = 8; // victory points
}

message Edge {
  uint32 a = 1;
  uint32 b = 2;
  int64 distance = 3;
  uint32 river = 4; // along the shared border: 0 = none, 1 = small, 2 = large
  uint32 rail = 5; // railway level, 0 = none
}

// A group of provinces with the industry and population of an area.
message State {
  string key = 1;
  string name = 2;
  uint32 capital = 3; // province ID
  int64 manpower = 4;
  int32 factories = 5; // military factories
  int32 infrastructure = 6;
}

message Faction {
  string key = 1;
  string name = 2;
  int32 capital = 3; // province ID, -1 = none
}

message ProvinceView {
  uint32 id = 1;
  uint32 controller = 2; // public; 0 = none
  bool visible = 3;
  bool in_battle = 4; // only meaningful when visible
}

message DivisionView {
  uint32 id = 1;
  uint32 faction = 2;
  uint32 type = 3;
  string name = 4;
  uint32 province = 5;
  int32 strength = 6;
  int32 org = 7;
  bool retreating = 8;

  // Own divisions only.
  bool own = 9;
  repeated uint32 path = 10;
  int64 progress = 11;
  int32 supply = 12;
}

message Snapshot {
  uint64 tick = 1;
  repeated ProvinceView provinces = 2;
  repeated DivisionView divisions = 3;
}

enum RemoveReason {
  REMOVE_REASON_UNSPECIFIED = 0;
  REMOVE_REASON_DESTROYED = 1;
  REMOVE_REASON_OUT_OF_SIGHT = 2;
}

message RemovedDivision {
  uint32 id = 1;
  RemoveReason reason = 2;
}

message Delta {
  uint64 tick = 1;
  repeated ProvinceView provinces = 2; // changed records
  repeated DivisionView divisions = 3; // new or changed records
  repeated RemovedDivision removed = 4;
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_ACCEPTED = 1;
  COMMAND_STATUS_REJECTED = 2;
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_MALFORMED = 1;
  REJECT_REASON_NOT_YOUR_DIVISION = 2;
  REJECT_REASON_DIVISION_RETREATING = 3;
  REJECT_REASON_UNKNOWN_PROVINCE = 4;
  REJECT_REASON_NO_PATH = 5;
  REJECT_REASON_QUEUE_FULL = 6;
  REJECT_REASON_MATCH_NOT_STARTED = 7;
}

message CommandResult {
  uint32 client_seq = 1;
  CommandStatus status = 2;
  RejectReason reason = 3;
  uint64 apply_tick = 4;
}

enum MatchPhase {
  MATCH_PHASE_UNSPECIFIED = 0;
  MATCH_PHASE_LOBBY = 1;
  MATCH_PHASE_RUNNING = 2;
}

message Player {
  uint32 faction_id = 1;
  string name = 2;
}

message MatchStatus {
  MatchPhase phase = 1;
  bool paused = 2;
  uint32 speed = 3;
  uint64 tick = 4;
  uint32 host_faction = 5; // 0 = nobody connected
  repeated Player players = 6;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_BAD_MESSAGE = 1;
  ERROR_CODE_UNSUPPORTED_VERSION = 2;
  ERROR_CODE_UNKNOWN_MATCH = 3;
  ERROR_CODE_UNKNOWN_FACTION = 4;
  ERROR_CODE_FACTION_TAKEN = 5;
  ERROR_CODE_NOT_JOINED = 6;
  ERROR_CODE_NOT_HOST = 7;
  ERROR_CODE_INVALID_SPEED = 8;
  ERROR_CODE_SLOW_CONSUMER = 9;
  ERROR_CODE_SERVER_SHUTDOWN = 10;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  bool fatal = 3;
}
